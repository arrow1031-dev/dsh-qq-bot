# CI：push（main）与 PR 自动跑全部测试。
# 26 套件经 run-all 汇总：adapter / adapter-reverse / plugin / client / admin / http / config /
# websearch / imagegen / session-id / compat / history / proactive / proactive-round /
# owner-settings / adapter-onebot12 / adapter-milky / adapter-satori / adapter-qq-official /
# totp / totp-cli / qr / flow-auth / flow-store / flow-commands / flow-gate。
#
# 纯文档改动不触发（README / CHANGELOG / 架构说明 / 许可证等 *.md 与 docs/），
# 免得改个错别字也跑一轮全量。
#
# @deepseek-ai/dsh-tools 是 DSH 运行时的 optional peer，CI 解析不到时插件套件相关断言自动 SKIP，其余照常全绿。
# package-lock.json / pnpm-lock.yaml 被 .gitignore 排除（仓库有意不锁版本），所以这里用 npm install。
name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 安装依赖（npm install）
        run: npm install

      - name: 跑全部测试（run-all 汇总）
        run: npm test
